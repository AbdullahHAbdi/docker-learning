version: '3.8'

services:
  flask:
    build: ./app
    expose:
      - "5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FLASK_ENV=development
    depends_on:
      - redis

  redis:
    build: ./redis
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:latest
    ports:
      - "5000:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - flask

volumes:
  redis-data: